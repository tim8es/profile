projects:
  - id: tubescore
    name: TubeScore
    links:
      github: https://github.com/tim8es/TubeScore
    facts:
      - id: project.tubescore.overview
        topics: [projects, tubescore, browser, chrome, youtube, product]
        text:
          ru: TubeScore — Chrome/Chromium Manifest V3 extension, который определяет фильм или сериал на YouTube и показывает рейтинги рядом с metadata видео.
          en: TubeScore is a Chrome/Chromium Manifest V3 extension that identifies a movie or TV series on YouTube and shows ratings near the video metadata.
        source:
          label: TubeScore
          url: https://github.com/tim8es/TubeScore
        confidence: verified
        public: true

      - id: project.tubescore.architecture
        topics: [projects, tubescore, architecture, testing, browser]
        text:
          ru: Production runtime TubeScore не требует API key, backend, LLM или computer vision; matching детерминированный, данные идут через официальный Wikidata Action API.
          en: TubeScore's production runtime requires no API key, backend, LLM or computer vision; matching is deterministic and data comes through the official Wikidata Action API.
        source:
          label: TubeScore README
          url: https://github.com/tim8es/TubeScore
        confidence: verified
        public: true

      - id: project.tubescore.verification
        topics: [projects, tubescore, testing, quality]
        text:
          ru: Проверка TubeScore включает strict TypeScript typecheck, Vitest suite, production build isolation и browser acceptance smoke в Chromium.
          en: TubeScore verification includes strict TypeScript typecheck, the Vitest suite, production build isolation and browser acceptance smoke in Chromium.
        source:
          label: TubeScore README
          url: https://github.com/tim8es/TubeScore
        confidence: verified
        public: true

  - id: ai-critic
    name: AI Critic
    links:
      github: https://github.com/tim8es/ai-critic
    facts:
      - id: project.critic.overview
        topics: [projects, critic, ai, agents, reliability]
        text:
          ru: AI Critic — evidence-backed система, которая должна помнить релевантный рабочий контекст, находить существенные ошибки или противоречия и вмешиваться только когда польза критики достаточно высока.
          en: AI Critic is an evidence-backed system intended to remember relevant work context, detect material mistakes or contradictions and intervene only when the expected value of criticism is high.
        source:
          label: AI Critic
          url: https://github.com/tim8es/ai-critic
        confidence: verified
        public: true

      - id: project.critic.architecture
        topics: [projects, critic, ai, architecture, privacy, security]
        text:
          ru: Проект разделяет Context/Critic/Verifier workflow, local-first Ambient architecture и узкий privacy-gated Lite Bridge experiment; автономные действия в сторонних приложениях не входят в scope.
          en: The project separates Context/Critic/Verifier workflows, a local-first Ambient architecture and a narrow privacy-gated Lite Bridge experiment; autonomous actions in third-party apps are out of scope.
        source:
          label: AI Critic README
          url: https://github.com/tim8es/ai-critic
        confidence: verified
        public: true

      - id: project.critic.status
        topics: [projects, critic, testing, security]
        text:
          ru: В репозитории есть strict TypeScript и targeted security-flow PASS evidence для новых safe-root/Codex модулей; реальная Windows/Codex host verification отделена и ещё требуется до dogfood.
          en: The repository has strict TypeScript and targeted security-flow PASS evidence for the new safe-root/Codex modules; real Windows/Codex host verification is separate and still required before dogfood.
        source:
          label: AI Critic README
          url: https://github.com/tim8es/ai-critic
        confidence: verified
        public: true

  - id: github-agent-continuity
    name: GitHub Agent Continuity
    links:
      github: https://github.com/tim8es/github-agent-continuity
    facts:
      - id: project.gac.overview
        topics: [projects, gac, agents, github, infrastructure]
        text:
          ru: GitHub Agent Continuity позволяет автономным coding-агентам продолжать работу между независимыми или scheduled-сессиями, используя GitHub как durable coordination state.
          en: GitHub Agent Continuity lets autonomous coding agents continue work across independent or scheduled sessions using GitHub as durable coordination state.
        source:
          label: GitHub Agent Continuity
          url: https://github.com/tim8es/github-agent-continuity
        confidence: verified
        public: true

      - id: project.gac.protocol
        topics: [projects, gac, agents, architecture, concurrency]
        text:
          ru: Протокол использует Issues, immutable generation claim refs, отдельные work branches, leases, checkpoints и takeover rules для cooperative crash-tolerant coordination.
          en: The protocol uses Issues, immutable generation claim refs, separate work branches, leases, checkpoints and takeover rules for cooperative crash-tolerant coordination.
        source:
          label: GAC README
          url: https://github.com/tim8es/github-agent-continuity
        confidence: verified
        public: true

      - id: project.gac.verification
        topics: [projects, gac, testing, concurrency]
        text:
          ru: Adversarial live subset GAC завершился с 5 PASS, 0 FAIL и 0 NOT EXECUTED, включая claim serialization, takeover и stale-writer isolation.
          en: GAC's adversarial live subset completed with 5 PASS, 0 FAIL and 0 NOT EXECUTED, including claim serialization, takeover and stale-writer isolation.
        source:
          label: GAC README
          url: https://github.com/tim8es/github-agent-continuity
        confidence: verified
        public: true

