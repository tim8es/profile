skills:
  product:
    - id: skills.product
      topics: [skills, product, mvp, discovery]
      text:
        ru: Тимур умеет переводить размытые задачи в ограниченный проверяемый scope и доводить решение до MVP или рабочего процесса.
        en: Timur can turn ambiguous problems into bounded testable scope and get to an MVP or working process.
      source:
        label: Product work
      confidence: verified
      public: true
  process:
