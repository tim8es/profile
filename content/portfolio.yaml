projects:
  - id: audit
    name: Audit Process Consulting
    facts:
      - id: project.audit.limit
        topics: [projects, audit, limitations, automation, research]
        text:
          ru: Внешние решения для дальнейшей автоматизации аудита были исследованы, но полноценная автоматизированная система аудита внедрена не была.
          en: External solutions for further audit automation were researched, but a fully automated audit system was not implemented.
        source:
          label: Audit automation boundary
        confidence: verified
        public: true
      - id: project.audit.overview
        topics: [projects, audit, process, consulting, automation]
        text:
          ru: Audit Process Consulting — проект по анализу и переработке ручного процесса контроля качества коммуникаций.
          en: Audit Process Consulting was a process-analysis and redesign project around a manual communication-quality audit workflow.
        source:
          label: Audit process case
        confidence: verified
        public: true
      - id: project.audit.result
        topics: [projects, audit, results, metrics, crm]
        text:
          ru: Реально внедрённая часть — перенос ручных процессов из Google Workspace во внутреннюю CRM; скорость обработки выросла примерно на 20%, а отслеживание метрик стало прозрачнее.
          en: The implemented part was moving manual process steps from Google Workspace into the internal CRM; processing speed improved by about 20% and metric tracking became more transparent.
        source:
          label: Audit process result
        confidence: verified
        public: true
      - id: project.audit.role
        topics: [projects, audit, role, process, crm]
        text:
          ru: Тимур работал на стыке operations и IT: разобрал текущий workflow, уточнял требования и участвовал в переносе ручных шагов контроля качества во внутреннюю CRM.
          en: Timur worked between operations and IT: he mapped the workflow, clarified requirements and helped move manual quality-control steps into the internal CRM.
        source:
          label: Audit process role
        confidence: verified
        public: true
  - id: crm
    name: CRM Product Development
    facts:
      - id: project.crm.overview
        topics: [projects, crm, product, b2b, delivery]
        text:
          ru: CRM Product Development — развитие B2B Loyalty CRM с web-, mobile-, backend-частью и внешними интеграциями.
          en: CRM Product Development covered a B2B Loyalty CRM across web, mobile, backend and external integrations.
        source:
          label: CRM product
        confidence: verified
        public: true
      - id: project.crm.role
        topics: [projects, crm, role, delivery, requirements]
        text:
          ru: Тимур как IT Project Manager отвечал за требования, backlog, планирование, приоритеты, риски, ресурсы, коммуникацию с клиентом и delivery до релиза.
          en: As IT Project Manager, Timur handled requirements, backlog, planning, priorities, risks, resources, client communication and delivery to release.
        source:
          label: CRM role
        confidence: verified
        public: true
      - id: project.crm.scope
        topics: [projects, crm, scale, architecture, product]
        text:
          ru: Продукт представлял собой SaaS/on-premise экосистему из четырёх web-приложений, двух mobile-приложений, общего backend, PostgreSQL, платежей и внешних интеграций; бюджет разработки и поддержки превышал 20 млн ₽.
          en: The product was a SaaS/on-premise ecosystem with four web apps, two mobile apps, a shared backend, PostgreSQL, payments and external integrations; the development/support budget exceeded RUB 20M.
        source:
          label: CRM scope
        confidence: verified
        public: true
      - id: project.crm.stack
        topics: [projects, crm, technical, stack, integrations]
        text:
          ru: В продукт входили web/mobile приложения, backend, PostgreSQL, платежные интеграции, внешние API, monitoring и on-premise deployment.
          en: The product included web/mobile applications, backend, PostgreSQL, payment integrations, external APIs, monitoring and on-premise deployment.
        source:
          label: CRM stack
        confidence: verified
        public: true
  - id: bi
    name: Operations & BI Dashboards
    facts:
      - id: project.bi.overview
        topics: [projects, bi, analytics, operations, data]
        text:
          ru: Operations & BI Dashboards — система операционной аналитики, которая объединила показатели процессов и продуктов в повторно используемые дашборды.
          en: Operations & BI Dashboards consolidated process and product metrics into reusable operational dashboards.
        source:
          label: BI dashboards
        confidence: verified
        public: true
      - id: project.bi.purpose
        topics: [projects, bi, process, analytics]
        text:
          ru: Задача была не только в визуализации: решение заменяло повторяющуюся ручную отчётность и помогало раньше замечать отклонения.
          en: The goal was not just visualization: the solution replaced repeated manual reporting and made deviations easier to notice.
        source:
          label: BI purpose
        confidence: verified
        public: true
      - id: project.bi.result
        topics: [projects, bi, results, metrics, sql, datalens]
        text:
          ru: Дашборды на SQL + DataLens покрывали 20 продуктов и сократили время на регулярную подготовку отчётности примерно на 70%.
          en: The SQL + DataLens dashboards covered 20 products and reduced regular reporting preparation time by about 70%.
        source:
          label: BI result
        confidence: verified
        public: true
  - id: invoice
    name: Invoice Automation
    facts:
      - id: project.invoice.limit
        topics: [projects, invoice, limitations, email]
        text:
          ru: Email-отправка была технически реализована в разработке, но production-рассылка не запускалась; подтверждённый production-результат — автоматическая генерация инвойсов.
          en: Email sending was technically implemented during development, but production distribution was not launched; the verified production result is automated invoice generation.
        source:
          label: Invoice boundary
        confidence: verified
        public: true
      - id: project.invoice.overview
        topics: [projects, invoice, automation, n8n, javascript]
        text:
          ru: Invoice Automation — n8n/JavaScript workflow для автоматической подготовки инвойсов удалённым сотрудникам.
          en: Invoice Automation is an n8n/JavaScript workflow for preparing invoices for remote employees.
        source:
          label: Invoice Automation
        confidence: verified
        public: true
      - id: project.invoice.result
        topics: [projects, invoice, results, metrics, automation]
        text:
          ru: Один инвойс формировался менее чем за 15 секунд; workflow использовался бухгалтерией в реальных ежемесячных циклах.
          en: One invoice was generated in under 15 seconds, and the workflow was used by accounting in real monthly cycles.
        source:
          label: Invoice result
        confidence: verified
        public: true
      - id: project.invoice.role
        topics: [projects, invoice, role, automation]
        text:
          ru: Тимур самостоятельно спроектировал и реализовал workflow: от требований и проверки данных до тестирования, документации и production-use.
          en: Timur independently designed and implemented the workflow from requirements and data validation through testing, documentation and production use.
        source:
          label: Invoice role
        confidence: verified
        public: true
  - id: book
    name: Book Translator
    facts:
      - id: project.book.overview
        topics: [projects, book, ai, translation, telegram]
        text:
          ru: Book Translator — система AI-перевода длинных книг, объединённая с Telegram-ботом как пользовательским интерфейсом.
          en: Book Translator is an AI-assisted long-form translation system combined with a Telegram bot as the user-facing layer.
        source:
          label: Book Translator
        confidence: verified
        public: true
      - id: project.book.state
        topics: [projects, book, agents, state, reliability]
        text:
          ru: Система хранит прогресс, переведённые блоки, glossary, style guide и review-state вне одной chat-сессии, поэтому перевод можно последовательно продолжать между сессиями.
          en: The system stores progress, translated units, glossary, style guide and review state outside one chat session so translation can continue consistently across sessions.
        source:
          label: Book Translator state
        confidence: verified
        public: true
      - id: project.book.telegram
        topics: [projects, book, telegram, product]
        text:
          ru: Telegram-бот и translation workflow рассматриваются как один продукт: бот является пользовательским интерфейсом для работы с переводом.
          en: The Telegram bot and translation workflow are one product: the bot is the user-facing interface for the translation system.
        source:
          label: Book Translator Telegram
        confidence: verified
        public: true
  - id: video
    name: AI Video Pipeline
    facts:
      - id: project.video.boundary
        topics: [projects, video, review, limitations, automation]
        text:
          ru: Генерация отделена от публикации: система может остановиться на review-ready результате, а публикация остаётся отдельным контролируемым действием.
          en: Generation is separated from publishing: the system can stop at a review-ready result and publishing remains a separate controlled action.
        source:
          label: Video pipeline boundary
        confidence: verified
        public: true
      - id: project.video.overview
        topics: [projects, video, ai, automation, content]
        text:
          ru: AI Video Pipeline автоматизирует производство коротких видео от исследования и сценария до озвучки, субтитров, рендера и review.
          en: AI Video Pipeline automates short-form content production from research and scripting through voice, subtitles, rendering and review.
        source:
          label: AI Video Pipeline
        confidence: verified
        public: true
      - id: project.video.stack
        topics: [projects, video, technical, n8n, ffmpeg, llm]
        text:
          ru: Pipeline объединяет n8n, локальные LLM, FFmpeg, TTS, субтитры и локальные control-инструменты.
          en: The pipeline connects n8n, local LLMs, FFmpeg, TTS, subtitles and local control tooling.
        source:
          label: Video pipeline stack
        confidence: verified
        public: true
  - id: tube
    name: TubeScore
    facts:
      - id: project.tube.architecture
        topics: [projects, tube, tubescore, architecture, technical]
        text:
          ru: TubeScore использует Manifest V3, content scripts, service worker, детерминированный matching, Wikidata и caching; собственный backend, LLM и обязательный API-ключ не нужны.
          en: TubeScore uses Manifest V3, content scripts, a service worker, deterministic matching, Wikidata and caching; it requires no own backend, LLM or mandatory API key.
        source:
          label: TubeScore architecture
        confidence: verified
        public: true
      - id: project.tube.overview
        topics: [projects, tube, tubescore, browser, product]
        text:
          ru: TubeScore — Chrome/Chromium extension, который определяет фильм или сериал на YouTube и показывает рейтинг прямо в контексте просмотра.
          en: TubeScore is a Chrome/Chromium extension that identifies a movie or series on YouTube and shows its rating in the viewing context.
        source:
          label: TubeScore
        confidence: verified
        public: true
      - id: project.tube.testing
        topics: [projects, tube, tubescore, testing, playwright]
        text:
          ru: Browser-flow TubeScore проверяется автоматизированными Chromium/Playwright smoke-тестами, включая initial rendering и YouTube SPA navigation.
          en: TubeScore's browser flow is checked with automated Chromium/Playwright smoke tests, including initial rendering and YouTube SPA navigation.
        source:
          label: TubeScore testing
        confidence: verified
        public: true
  - id: lightning
    name: HH Lightning
    facts:
      - id: project.lightning.backend
        topics: [projects, lightning, backend, payments, licensing, technical]
        text:
          ru: В состав того же продукта входит отдельный backend для тарифов, лицензирования и платежей: Node.js, YooKassa, YDB, JWT и entitlement-логика.
          en: The same product includes a separate backend for tariffs, licensing and payments using Node.js, YooKassa, YDB, JWT and entitlement logic.
        source:
          label: HH Lightning backend
        confidence: verified
        public: true
      - id: project.lightning.features
        topics: [projects, lightning, hh, ai, analytics, automation]
        text:
          ru: Расширение объединяет AI-обработку вакансий, генерацию сопроводительных писем, автоотклики и аналитику эффективности резюме.
          en: The extension combines AI-assisted vacancy handling, cover-letter generation, automated responses and resume-performance analytics.
        source:
          label: HH Lightning features
        confidence: verified
        public: true
      - id: project.lightning.overview
        topics: [projects, lightning, hh, ai, browser, product]
        text:
          ru: HH Lightning — браузерный продукт для автоматизации повторяющихся этапов поиска работы на hh.ru.
          en: HH Lightning is a browser product for automating repetitive parts of the job-search workflow on hh.ru.
        source:
          label: HH Lightning
        confidence: verified
        public: true
  - id: market
    name: Job Market Scanner
    facts:
      - id: project.market.architecture
        topics: [projects, market, architecture, browser, nextjs, data]
        text:
          ru: Система объединяет resumable Chrome MV3 collector, versioned data contracts, валидируемые snapshots, историю и Next.js-интерфейс анализа.
          en: The system combines a resumable Chrome MV3 collector, versioned data contracts, validated snapshots, history and a Next.js analysis interface.
        source:
          label: Job Market Scanner architecture
        confidence: verified
        public: true
      - id: project.market.overview
        topics: [projects, market, data, analytics, product]
        text:
          ru: Job Market Scanner — data product для сбора и сравнения сигналов рынка труда по профессиям.
          en: Job Market Scanner is a data product for collecting and comparing labor-market signals across professions.
        source:
          label: Job Market Scanner
        confidence: verified
        public: true
      - id: project.market.quality
        topics: [projects, market, quality, reliability, data]
        text:
          ru: Настоящий ноль отделён от selector failure, блокировки и неизвестного значения; freshness определяется временем фактического сбора данных, а не временем деплоя.
          en: A real zero is kept distinct from selector failure, blocking and unknown values; freshness is based on actual collection time rather than deployment time.
        source:
          label: Job Market Scanner data quality
        confidence: verified
        public: true
  - id: feed
    name: FeedPulse
    facts:
      - id: project.feed.design
        topics: [projects, feed, feedpulse, node, cross-platform, technical]
        text:
          ru: FeedPulse намеренно сохраняет небольшой dependency surface и рассчитан на Windows, macOS и Linux.
          en: FeedPulse intentionally keeps a small dependency surface and targets Windows, macOS and Linux.
        source:
          label: FeedPulse design
        confidence: verified
        public: true
      - id: project.feed.overview
        topics: [projects, feed, feedpulse, agents, rss, atom]
        text:
          ru: FeedPulse — лёгкая утилита ingestion контента для AI-агентов, которая нормализует RSS/Atom-источники в предсказуемый формат.
          en: FeedPulse is a lightweight content-ingestion utility for AI agents that normalizes RSS/Atom sources into a predictable format.
        source:
          label: FeedPulse
        confidence: verified
        public: true

